# hunter 配置

resume_path: "../resume/resume.md"       # 简历路径，命令行 -r 可覆盖

# 岗位过滤
salary_min: 8                            # 最低薪资 K
salary_max: 20                           # 最高薪资 K
allowed_edu: ["本科", "大专"]             # 接受的学历，"学历不限"也会保留
deal_breakers: ["外包", "博彦科技", "管培", "单休", "实习", "华为", "阿里", "外企德科", "某大型", "佰钧成", "中软国际", "某中型", "某小型", "华钦软件", "万宝盛华", "软通动力"]

# 默认搜索（命令行参数会覆盖）
search:
  keywords: ["Python", "AI", "Agent"]
  cities: ["深圳", "广州"]

# DeepSeek API
ai:
  provider: "openai"
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"

# AI 评分
scoring:
  threshold: 60                           # 低于此分自动筛掉

output_dir: "./output"
